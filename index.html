    <link rel="icon" href="/favicon.ico" type="image/x-icon"> <style>
        /* Reset and Base Styles */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: '微軟正黑體', 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.8;
            color: #343a40;
            background-color: #eef2f7; /* 更現代感的淺藍灰色背景 */
            padding: 60px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            max-width: 1050px; /* 更寬的容器 */
            width: 100%;
            background: #ffffff;
            padding: 55px 70px; /* 更大的內邊距 */
            border-radius: 20px; /* 更圓潤的邊角 */
            box-shadow: 0 12px 45px rgba(0,0,0,0.12); /* 柔和但更明顯的陰影 */
            text-align: center;
            animation: fadeIn 1s ease-out forwards; /* 添加淡入動畫 */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #0056b3;
            font-size: 3.8em; /* 顯著的標題字體大小 */
            margin-bottom: 35px;
            font-weight: 800;
            letter-spacing: 2px; /* 增加字間距 */
            border-bottom: 4px solid #e9ecef;
            padding-bottom: 25px;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.1);
        }

        h2 {
            color: #2c3e50;
            font-size: 2.5em; /* 較大次的標題 */
            margin-top: 60px;
            margin-bottom: 30px;
            font-weight: 700;
        }

        p {
            font-size: 1.3em; /* 增大段落字體 */
            margin-bottom: 35px;
            color: #555;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 45px auto;
            max-width: 850px; /* 列表項最大寬度 */
        }

        li {
            background-color: #f6f9fc; /* 列表項淺灰色背景 */
            margin-bottom: 22px;
            padding: 25px 40px;
            border-left: 10px solid #007bff;
            border-radius: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s ease;
            display: flex;
            align-items: center;
            text-align: left;
        }

        li:hover {
            transform: translateY(-10px); /* 懸停上浮效果更明顯 */
            box-shadow: 0 18px 55px rgba(0,0,0,0.25); /* 更明顯的陰影 */
            background-color: #e0f2fe; /* 懸停時淺藍色背景 */
        }

        a {
            color: #007bff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease, text-decoration 0.3s ease;
            flex-grow: 1;
            word-break: break-word;
            overflow-wrap: break-word;
        }

        a:hover {
            color: #0056b3;
            text-decoration: underline;
        }

        .file-icon {
            font-size: 2em; /* 圖標更大 */
            margin-right: 25px;
            color: #007bff;
        }

        .file-description {
            display: block;
            font-size: 1em;
            color: #6c757d;
            margin-top: 8px;
        }

        .note {
            background-color: #e0f7fa; /* 淺青色背景 */
            border-left: 8px solid #00bcd4; /* 左側藍綠色邊框 */
            padding: 35px;
            margin-top: 70px;
            border-radius: 15px;
            text-align: left;
            color: #006064; /* 深青色文字 */
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
        }

        .note p {
            margin-bottom: 18px;
            font-size: 1.15em;
            line-height: 1.8;
            color: #006064;
        }

        .note b {
            color: #004d40;
        }

        .note ul {
            list-style: disc;
            padding-left: 40px;
            margin: 20px 0;
            max-width: none;
        }

        .note li {
            background-color: transparent;
            border-left: none;
            padding: 8px 0;
            margin-bottom: 12px;
            box-shadow: none;
            transform: none;
            color: #006064;
        }

        .note li:hover {
            transform: none;
            box-shadow: none;
        }

        .footer {
            margin-top: 80px;
            font-size: 0.95em;
            color: #888;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .container {
                padding: 45px 50px;
            }
            h1 { font-size: 3.2em; }
            h2 { font-size: 2.2em; }
            p { font-size: 1.2em; }
        }

        @media (max-width: 768px) {
            .container {
                padding: 35px;
            }
            h1 { font-size: 2.8em; margin-bottom: 25px; }
            h2 { font-size: 2em; margin-top: 40px; }
            p { font-size: 1.1em; margin-bottom: 25px; }
            li {
                padding: 20px 25px;
                flex-direction: column;
                align-items: flex-start;
            }
            .file-icon {
                margin-bottom: 12px;
                margin-right: 0;
            }
            .file-description { margin-top: 8px; }
        }

        @media (max-width: 480px) {
            body { padding: 30px 15px; }
            .container { padding: 25px; }
            h1 { font-size: 2.2em; line-height: 1.3; }
            h2 { font-size: 1.8em; }
            p { font-size: 1em; }
            li { padding: 15px 15px; }
            .note { padding: 20px; }
        }
    </style>
</head>
